name: Tenant isolation

on:
  push:
    paths:
      - "ai_core/**"
      - "tenants/**"
      - "index/**"
      - "outputs/h2_04/index_phongkham_hyhy/**"
      - "outputs/h3_01/index_*/**"
      - "tests/test_isolation_multi.py"
      - ".github/workflows/tenant-isolation.yml"
  pull_request:
    paths:
      - "ai_core/**"
      - "tenants/**"
      - "index/**"
      - "outputs/h2_04/index_phongkham_hyhy/**"
      - "outputs/h3_01/index_*/**"
      - "tests/test_isolation_multi.py"

jobs:
  isolation-five-tenants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 5-tenant isolation matrix
        run: python -m unittest tests.test_isolation_multi -v
