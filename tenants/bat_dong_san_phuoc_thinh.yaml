  escalate_when:
    - khách yêu cầu gặp môi giới hoặc đặt lịch xem nhà
    - hỏi pháp lý, đặt cọc, hợp đồng hoặc vay vốn
    - thông tin giá hoặc tình trạng bất động sản không có trong nguồn RAG
    - khách bức xúc
pricing:
  can_quote:
    - bat_dong_san_dang_rao
  must_contact:
    - thuong_luong
    - dat_coc
    - hop_dong
contact:
  hotline: 0906070939
  zalo: null
lead:
  ask_after_turns: 3
  max_requests: 2
  no_data_retry_message: Dạ, em chưa tìm thấy bất động sản phù hợp trong dữ liệu hiện có. Anh/chị cho em thêm khu vực, ngân sách hoặc loại nhà để em kiểm tra tiếp nhé?
