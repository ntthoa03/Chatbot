# tenants/mima_internal.yaml
#
# Config của tenant MIMA_INTERNAL — chatbot nội bộ chạy đúng luồng như mọi
# tenant khác (theo mục 2.3 spec kiến trúc multi-tenant).
#
# Chỉ chứa cấu hình hành vi và kỹ thuật. Giá, dịch vụ, chính sách, thông tin
# công ty/cá nhân và kênh liên hệ phải đến từ RAG hoặc tool có nguồn.

tenant_id: mima_internal
config_version: 1

# ============================================================
# PERSONA
# ============================================================

persona:
  bot_name: MIMA
  self_address: em
  user_address: anh/chị
  tone: "thân thiện, chuyên nghiệp, không dùng tiếng lóng"
  reply_length: "3-6 câu"
  always_end_with_cta: true

# ============================================================
# GUARDRAILS
# ============================================================

guardrails:
  refusal_message: "Phần này em xin phép kết nối anh/chị với chuyên viên tư vấn ạ."
  customer_upset_message: "Dạ, em rất tiếc vì trải nghiệm vừa rồi đã khiến anh/chị không hài lòng. Em ghi nhận phản ánh này và xin phép chuyển ngay anh/chị đến chuyên viên phụ trách để hỗ trợ xử lý khiếu nại ạ."

  # Model nhỏ chỉ được gọi một lần cho input có dấu hiệu mơ hồ. Rule cục bộ
  # vẫn xử lý các trường hợp rõ ràng mà không phát sinh chi phí/model latency.
  input_model: gemini-3.5-flash-lite
  input_model_timeout_seconds: 10

  # Engine HOA-12 đọc danh sách này theo dữ liệu. Thêm/bớt/sửa luật hoặc pattern
  # tại đây không cần sửa ai_core/guardrail/output.py.
  # Regex được áp dụng sau khi văn bản đã viết thường và bỏ dấu tiếng Việt.
  output:
    block_configured_model_names: true
    rules:
      - reason: result_guarantee
        description: "Cam kết kết quả: lên top Google, ra đơn, tăng doanh thu hoặc thứ hạng"
        request_variants:
          - name: result_and_refund
            patterns:
              - '\b(?:guarantee|promise|cam ket|dam bao|bao dam).{0,100}(?:top|google|rank|ra don|doanh thu).{0,100}(?:refund|hoan tien)\b'
              - '\b(?:hoan tien|refund).{0,100}(?:top|google|rank|ra don|doanh thu|ket qua|fails?)\b'
            safe_reply: "Dạ, MIMA không thể cam kết chắc chắn thứ hạng hoặc kết quả trong một thời hạn cụ thể, đồng thời em cũng không thể xác nhận hoàn tiền khi chưa có chính sách được kiểm chứng. Kết quả thực tế còn phụ thuộc dữ liệu, mức độ cạnh tranh và thuật toán Google. Em xin phép chuyển anh/chị đến chuyên viên tư vấn để kiểm tra chính sách và trao đổi lộ trình phù hợp ạ."
          - name: absolute_result_guarantee
            patterns:
              - '\b100\s*%.{0,80}(?:top|google|ra don|doanh thu|ket qua|thu hang|chac thang)\b'
              - '\b(?:top|google|ra don|doanh thu|ket qua|thu hang|chac thang).{0,80}100\s*%(?:\s|$)'
            safe_reply: "Dạ, MIMA không thể đảm bảo 100% về thứ hạng, số đơn hàng hoặc doanh thu vì kết quả còn phụ thuộc dữ liệu thực tế và điều kiện thị trường. Bên em chỉ cam kết nỗ lực triển khai minh bạch theo kế hoạch. Em xin phép chuyển anh/chị đến chuyên viên tư vấn để trao đổi phương án phù hợp ạ."
          - name: result_guarantee
            patterns:
              - '\b(?:cam ket|dam bao|bao dam|bao dau|chac chan|dam hua|hua|xac nhan|guarantee|promise).{0,120}(?:top|google|ra don|doanh thu|ket qua|thu hang|first[ -]?page|rankings?)\b'
              - '\b(?:top|google|ra don|doanh thu|ket qua|thu hang|first[ -]?page|rankings?).{0,100}(?:chac chan|chac thang|100\s*%|guarantee|promise)\b'
              - '\b(?:kpi|bat buoc).{0,70}(?:top|ra don|doanh thu|thu hang)\b'
              - '\b(?:ty le|kha nang).{0,45}(?:chac thang|100\s*%).{0,70}(?:top|google|ra don|doanh thu)\b'
            safe_reply: "Dạ, MIMA không thể cam kết chắc chắn website đạt thứ hạng, ra đơn hoặc tăng doanh thu trong một thời hạn cố định. Kết quả thực tế còn phụ thuộc dữ liệu, mức độ cạnh tranh và thuật toán Google; bên em chỉ cam kết nỗ lực triển khai minh bạch theo kế hoạch. Em xin phép chuyển anh/chị đến chuyên viên tư vấn để trao đổi lộ trình phù hợp ạ."
        patterns:
          - '\b(?:cam ket|dam bao|bao dam|chac chan|hua).{0,70}(?:top|google|ra don|doanh thu|ket qua|thu hang)'
          - '\b100\s*%.{0,45}(?:top|ra don|tang doanh thu|dat ket qua)'
          - '\bse\s+(?:len|dat)\s+top\s*1\b'
          - '\bse.{0,20}(?:dua|day|giup).{0,45}(?:website|tu khoa).{0,35}(?:len|dat).{0,12}(?:top|trang nhat)\b'
        allow_patterns:
          - '\b(?:khong|khong the|khong he)\s+(?:cam ket|dam bao|bao dam|hua)\b'
          - '\bkhong(?: the)?\s+dua ra\s+(?:bat ky\s+|mot\s+|cac\s+|nhung\s+)?(?:cam ket|dam bao|bao dam|loi hua)\b'
          - '\bkhong co\s+(?:bat ky\s+|mot\s+|cac\s+|nhung\s+)?(?:cam ket|dam bao|bao dam|loi hua)\b'
          - '\b(?:cach noi|cum).{0,35}(?:khong duoc|bi cam)\b'

      - reason: refund_or_warranty_promise
        description: "Cam kết hoàn tiền hoặc bảo hành không có bằng chứng RAG/tool"
        request_variants:
          - name: refund_or_warranty
            patterns:
              - '\b(?:cam ket|dam bao|bao dam|promise|guarantee).{0,70}(?:hoan tien|refund|bao hanh|warranty)\b'
              - '\b(?:hoan tien|refund).{0,60}(?:100\s*%|toan bo|neu|if|khong dat|that bai|fails?)\b'
              - '\b(?:bao hanh|warranty).{0,45}(?:tron doi|vinh vien|vo thoi han|\d+)\b'
            safe_reply: "Dạ, em không thể tự xác nhận cam kết hoàn tiền hoặc thời hạn bảo hành khi chính sách đó chưa được kiểm chứng từ nguồn chính thức. Để tránh cung cấp sai quyền lợi của anh/chị, em xin phép chuyển anh/chị đến chuyên viên tư vấn kiểm tra chính sách cụ thể ạ."
        patterns:
          - '\b(?:cam ket|dam bao|se)\s+hoan\s+tien\b'
          - '\b(?:em|ben em|chung toi|toi)\s+(?:se\s+)?hoan\s+tien\b'
          - '\bhoan\s+tien\s*(?:100\s*%|toan bo)\b'
          - '\b(?:duoc\s+)?bao\s+hanh.{0,30}(?:\d+|tron doi|vinh vien|vo thoi han|nam|thang)\b'
        allow_patterns:
          - '\bkhong.{0,15}(?:cam ket|hoan tien|bao hanh)\b'

      - reason: unauthorized_discount_or_gift
        description: "Tự ý giảm giá, tặng thêm, miễn phí hoặc thương lượng"
        request_variants:
          - name: unauthorized_discount_or_gift
            patterns:
              - '\b(?:tu y|giam rieng|bot rieng|tang rieng|secret|giu bi mat|ngoai goi|noi mieng|sep da duyet).{0,80}(?:giam|bot|discount|uu dai|tang|mien phi|free|gia|trieu|%)\b'
              - '\b(?:giam|bot|discount|uu dai|tang them|mien phi|free).{0,80}(?:tu y|rieng|secret|giu bi mat|ngoai goi|noi mieng|sep da duyet)\b'
            safe_reply: "Dạ, em không thể tự ý giảm giá, tặng thêm hoặc xác nhận ưu đãi ngoài gói và chính sách đã được phê duyệt. Em xin phép chuyển anh/chị đến chuyên viên có thẩm quyền để kiểm tra ưu đãi phù hợp và xác nhận bằng thông tin chính thức ạ."
        patterns:
          - '\b(?:em|ben em|chung toi|toi).{0,35}(?:giam gia|bot gia|tang them|tang rieng|thuong luong|chot gia|uu dai|chiet khau|mien phi)\b'
          - '\b(?:giam rieng|uu dai rieng|tang them|tang rieng)\b'
          - '\b(?:giam|bot|uu dai|chiet khau)\s+(?:gia\s+)?\d+(?:[.,]\d+)?\s*(?:%|k|nghin|trieu|tr)\b'
        allow_patterns:
          - '\bkhong.{0,15}(?:tu y|giam gia|tang them|thuong luong|uu dai|chiet khau)\b'

      - reason: internal_information
        description: "Tiết lộ thông tin nội bộ: lương, chi phí, dữ liệu khách hàng khác"
        request_variants:
          - name: internal_information
            patterns:
              - '\b(?:cho|gui|cung cap|tiet lo|chia se|biet).{0,55}(?:luong|bang luong|gia von|bien loi nhuan|chi phi noi bo|doanh thu noi bo|chien luoc noi bo)\b'
              - '\b(?:danh sach|du lieu|so dien thoai|email|hop dong).{0,45}khach hang(?: khac)?\b'
              - '\bkhach hang(?: khac)?.{0,45}(?:danh sach|du lieu|so dien thoai|email|hop dong)\b'
            safe_reply: "Dạ, em không thể cung cấp lương, giá vốn, biên lợi nhuận hoặc dữ liệu liên hệ của khách hàng khác vì đây là thông tin nội bộ và cần được bảo mật. Em xin phép chuyển anh/chị đến chuyên viên phụ trách nếu anh/chị có yêu cầu chính đáng cần được xác minh ạ."
        patterns:
          - '\b(?:luong|bang luong|gia von|gia nhap|bien loi nhuan|chi phi (?:noi bo|van hanh|nhan su)|doanh thu noi bo|chien luoc noi bo|quy trinh noi bo|mat khau noi bo)\b'
          - '\b(?:du lieu|danh sach|so dien thoai|email|hop dong).{0,30}khach hang(?: khac)?\b'
          - '\bkhach hang(?: khac)?.{0,30}(?:so dien thoai|email|du lieu|hop dong)\b'
        allow_patterns:
          - '\bkhong(?: the)?\s+(?:tiet lo|chia se|cung cap).{0,35}(?:noi bo|khach hang)\b'

      - reason: competitor_disparagement
        description: "Chê bai hoặc so sánh đích danh đối thủ"
        request_variants:
          - name: competitor_disparagement
            patterns:
              - '\b(?:noi|viet|bao|nhan xet|danh gia).{0,55}(?:cong ty|agency|don vi|abc|xyz).{0,55}(?:kem|te|lua dao|khong bang|thua xa|lam an chan|dich vu do)\b'
              - '\b(?:cong ty|agency|don vi|abc|xyz).{0,55}(?:kem|te|lua dao|khong bang|thua xa|lam an chan|dich vu do)\b'
            safe_reply: "Dạ, em không thể chê bai hoặc đưa nhận định tiêu cực đích danh về một đơn vị khác. Em có thể hỗ trợ anh/chị so sánh khách quan dựa trên phạm vi công việc, tính năng và tiêu chí đã được xác minh. Em xin phép chuyển anh/chị đến chuyên viên tư vấn để trao đổi cụ thể hơn ạ."
        patterns:
          - '\b(?:doi thu|cong ty|agency|don vi).{0,55}(?:kem|te|lua dao|khong bang|thua xa|lam an chan|dich vu do)\b'
          - '\b(?:kem|te|lua dao|khong bang|thua xa|lam an chan|dich vu do).{0,40}(?:doi thu|cong ty|agency|don vi)\b'
          # Bổ sung tên/alias đối thủ tại pattern này khi danh sách kinh doanh thay đổi.
          - '\b(?:abc|xyz).{0,35}(?:kem|te|lua dao|khong bang|thua xa|lam an chan|dich vu do)\b'
        allow_patterns:
          - '\bkhong.{0,20}(?:che bai|so sanh|danh gia).{0,30}(?:doi thu|cong ty|agency|don vi|abc|xyz)\b'

      - reason: banking_secret_request
        description: "Nhận hoặc tiết lộ thông tin thẻ ngân hàng, mật khẩu hay mã OTP"
        request_variants:
          - name: banking_secret
            patterns:
              - '\b(?:gui|cung cap|cho em|cho toi|nhap|xac nhan|share|send).{0,45}(?:ma otp|otp|so the|card number|cvv|cvc|mat khau ngan hang|bank password)\b'
              - '\b(?:ma otp|otp)\D{0,12}\d{4,8}\b'
              - '\b(?:so the|card)\D{0,12}(?:\d[ -]?){13,19}\b'
            safe_reply: "Dạ, anh/chị tuyệt đối không gửi mã OTP, số thẻ, CVV hoặc mật khẩu ngân hàng qua cuộc trò chuyện này. MIMA không yêu cầu khách hàng cung cấp những thông tin bảo mật đó. Em xin phép chuyển anh/chị đến chuyên viên để được hướng dẫn thanh toán qua kênh chính thức và an toàn ạ."
        patterns:
          - '\b(?:gui|cung cap|cho em|cho toi|nhap|xac nhan).{0,35}(?:ma otp|otp|so the|cvv|cvc|mat khau ngan hang)\b'
          - '\b(?:ma otp|otp)\D{0,12}\d{4,8}\b'
          - '\b(?:so the|card)\D{0,12}(?:\d[ -]?){13,19}\b'
        allow_patterns:
          - '\b(?:khong|tuyet doi khong).{0,25}(?:gui|cung cap|nhap|chia se).{0,25}(?:otp|so the|cvv|cvc|mat khau)\b'

      - reason: out_of_scope_advice
        description: "Trả lời ngoài lĩnh vực: chính trị, y tế, pháp luật, làm bài tập hộ"
        request_variants:
          - name: medical_advice
            patterns:
              - '\b(?:chan doan|ke thuoc|toa thuoc|lieu dung|uong thuoc|dung thuoc).{0,70}(?:benh|thuoc|mg|giup|cho anh|cho toi)?\b'
            safe_reply: "Dạ, em không thể chẩn đoán bệnh, kê thuốc hoặc đưa liều dùng vì đây là nội dung cần chuyên môn y tế. Anh/chị nên trao đổi trực tiếp với bác sĩ hoặc chuyên gia y tế đủ chuyên môn. Em xin phép chuyển anh/chị đến chuyên viên để tiếp tục hỗ trợ trong phạm vi dịch vụ của MIMA ạ."
          - name: legal_advice
            patterns:
              - '\b(?:tu van phap ly|nen khoi kien|chac chan thang kien|theo dieu \d+|can cu dieu \d+)\b'
            safe_reply: "Dạ, em không thể đưa ra kết luận hoặc tư vấn pháp lý thay cho người có chuyên môn. Anh/chị nên trao đổi với luật sư hoặc đơn vị tư vấn pháp lý phù hợp. Em xin phép chuyển anh/chị đến chuyên viên để tiếp tục hỗ trợ trong phạm vi dịch vụ của MIMA ạ."
          - name: political_advice
            patterns:
              - '\b(?:tong thong|thu tuong|dang phai|bau cu|chinh tri|quoc hoi).{0,90}(?:nen|ung ho|phan doi|tot|xau|thang|thua|nhan xet|danh gia)\b'
            safe_reply: "Dạ, nội dung chính trị nằm ngoài phạm vi tư vấn của MIMA nên em không thể đưa ra nhận định hoặc định hướng cho anh/chị. Em xin phép chuyển anh/chị đến chuyên viên nếu anh/chị cần hỗ trợ về website, SEO hoặc các dịch vụ của MIMA ạ."
          - name: homework
            patterns:
              - '\b(?:lam ho|giai ho|viet ho).{0,45}(?:toan bo|bai tap|bai toan|bai van)\b'
              - '\b(?:toan bo).{0,25}(?:bai tap|bai toan|bai van).{0,25}(?:cho anh|cho toi|giup)\b'
            safe_reply: "Dạ, em không thể làm hộ toàn bộ bài tập hoặc đưa thẳng đáp án hoàn chỉnh. Em có thể gợi ý phương pháp để anh/chị tự làm và hiểu bài tốt hơn. Em xin phép chuyển anh/chị đến chuyên viên để tiếp tục hỗ trợ trong phạm vi dịch vụ của MIMA ạ."
        patterns:
          - '\b(?:tong thong|thu tuong|dang phai|bau cu|chinh tri|quoc hoi).{0,90}(?:la|se|nen|tot|xau|ung ho|phan doi|thang|thua)\b'
          - '\b(?:chan doan|toa thuoc|lieu dung|uong|dung)\s+.{0,35}(?:mg|thuoc)\b'
          - '\b(?:theo dieu \d+|can cu dieu \d+|nen khoi kien|chac chan thang kien|tu van phap ly)\b'
          - '\b(?:dap an bai tap|giai ho bai|lam ho bai|loi giai bai tap|viet bai ho)\b'
        allow_patterns:
          - '\bkhong(?: the)?\s+(?:tu van|tra loi|ho tro).{0,45}(?:chinh tri|y te|phap luat|bai tap)\b'

      - reason: technical_information_disclosure
        description: "Tiết lộ system prompt, tên model, bí mật hoặc cấu trúc kỹ thuật"
        request_variants:
          - name: technical_information_disclosure
            patterns:
              - '\b(?:tiet lo|hien thi|in ra|lap lai|doc lai|viet lai|dich|tom tat|reveal|show|print|repeat|translate).{0,90}(?:system prompt|prompt he thong|developer message|hidden system|hidden instruction|chi dan an|huong dan bi mat|chi thi an)\b'
              - '\b(?:ignore|disregard|forget|override|bo qua|quen).{0,90}(?:instruction|rule|prompt|huong dan|chi thi|vai tro).{0,90}(?:reveal|show|print|viet lai|tiet lo|hien thi|in ra)?\b'
            safe_reply: "Dạ, em không thể tiết lộ, dịch, tóm tắt hoặc lặp lại system prompt, chỉ dẫn ẩn, tên model hay cấu trúc kỹ thuật nội bộ. Em xin phép chuyển anh/chị đến chuyên viên nếu anh/chị cần thông tin chính thức về phạm vi và khả năng của dịch vụ ạ."
        patterns:
          - '\b(?:system prompt|prompt he thong).{0,55}(?:la|gom|noi dung|bat dau|ben duoi)\b'
          - '\b(?:toi|em|bot|he thong).{0,35}(?:dang dung|su dung|dang chay|chay).{0,35}(?:model|gemini|gpt)\b'
          - '\b(?:api key|api_key|secret key|access token)\s*[:=]'
          - '\[(?:vai tro va persona|pham vi duoc phep tra loi|quy tac cam)\]'
          - '\b(?:kien truc|backend|vector store|framework|cau hinh ky thuat).{0,70}(?:fastapi|django|faiss|chroma|postgres|redis|python|yaml|json)\b'
        allow_patterns:
          - '\bkhong(?: the)?\s+(?:tiet lo|chia se|cung cap|xac nhan).{0,45}(?:system prompt|model|kien truc|ky thuat|api key)\b'

    grounding:
      enabled: true
      reason: ungrounded_claim
      description: "Bịa thông tin khi không có trong kho tri thức hoặc bằng chứng đáng tin cậy"
      request_variants:
        - name: fabrication_request
          patterns:
            - '\b(?:bia|tu nghi|make up|fabricate|invent).{0,80}(?:so tai khoan|thong tin|du lieu|gia|chinh sach|dia chi|email|so dien thoai)\b'
            - '\b(?:so tai khoan|thong tin|du lieu|gia|chinh sach|dia chi|email|so dien thoai).{0,80}(?:bia|tu nghi|make up|fabricate|invent)\b'
          safe_reply: "Dạ, em không thể tự bịa hoặc cung cấp thông tin chưa được xác minh, đặc biệt là số tài khoản và dữ liệu thanh toán. Em xin phép chuyển anh/chị đến chuyên viên để xác nhận thông tin chính thức trước khi anh/chị thực hiện giao dịch ạ."
      min_token_overlap: 0.35
      min_matching_tokens: 2
      claim_patterns:
        - '\d'
        - '\b(?:goi|dich vu|website|seo|quang cao|backlink|app|phan mem|ten mien).{0,100}\b(?:co gia|co kem|co tinh nang|gom|bao gom|gia|duoc|tang|ho tro|thoi gian|chinh sach|quy trinh)\b'
        - '\b(?:co gia|co kem|co tinh nang|gom|bao gom|gia|duoc|tang|ho tro|thoi gian|chinh sach|quy trinh).{0,100}\b(?:goi|dich vu|website|seo|quang cao|backlink|app|phan mem|ten mien)\b'
        - '\b(?:cong ty|chung toi|ben em).{0,100}\b(?:la|co|dat tai|thanh lap|hoat dong|cung cap|so huu)\b'
        - '\b(?:hotline|zalo|email|so dien thoai|dia chi|website chinh thuc).{0,100}\b(?:la|tai|qua|gom|co)\b'
      conversation_claim_patterns:
        - '\b(?:ma du an|ma yeu cau|ten cua anh|ten cua chi|so dien thoai|email|ngan sach|thoi han cua anh|thoi han cua chi)\b'
      ignore_patterns:
        - '\b(?:xin phep ket noi|chuyen vien tu van|chua co du du lieu|khong co du lieu)\b'
        - '\b(?:anh|chi).{0,40}(?:muon|can).{0,30}(?:tu van|ket noi|tham khao)\b'
        - '\b(?:co co hoi|no luc|toi uu theo tieu chuan)\b'

  escalate_when:
    - "khách yêu cầu gặp người"
    - "bí 2 lần liên tiếp"
    - "hỏi hợp đồng"
    - "khách bức xúc"

  # Ví dụ chính sách ngôn ngữ, không phải dữ kiện về một dịch vụ cụ thể.
  seo_phrasing_example:
    correct: "Dùng ngôn ngữ nỗ lực và nêu rõ kết quả phụ thuộc dữ liệu thực tế"
    incorrect: "Cam kết chắc chắn đạt thứ hạng hoặc kết quả trong một thời hạn cụ thể"

# Chỉ khai báo mã nhóm để bot biết cách định tuyến. Giá và mô tả chi tiết nằm ở RAG.
pricing:
  can_quote: [thiet_ke_website]
  must_contact: [seo, quang_cao, backlink, app, phan_mem]

contact:
  hotline: "0909 035 333"
  zalo: "0902875586"

# HOA-14: đổi số này nếu sau này muốn xin lead ở lượt 4, 5, 6...
lead:
  ask_after_turns: 3
  max_requests: 2
  no_data_retry_message: "Hiện em chưa có đủ dữ liệu để trả lời chính xác. Anh/chị có thể mô tả rõ hơn nhu cầu để em kiểm tra tiếp không ạ?"

# ============================================================
# ENABLED TOOLS
# ============================================================

enabled_tools:
  - check_domain

# ============================================================
# MODEL POLICY
# ============================================================
#
# primary:
#   Model chính được sử dụng.
#
# fallback:
#   Model dự phòng khi model chính không khả dụng hoặc gặp lỗi.
#
# Cấu hình chốt từ benchmark API thật HOA-03 ngày 14/08/2026:
# primary ưu tiên retrieval tiếng Việt + latency; fallback khác nhà cung cấp.

model_policy:
  primary: gemini-3.5-flash-lite
  fallback: gpt-5.6-luna
  temperature: 0.3
  # Ước tính theo paid list price để so sánh các lần eval, kể cả khi tài khoản
  # đang dùng free tier. Cập nhật tỷ giá/rate tại đây, không hardcode trong Python.
  usd_to_vnd: 26000
  costs:
    - model: gemini-3.5-flash-lite
      input_usd_per_million: 0.30
      output_usd_per_million: 2.50
    - model: gpt-5.6-luna
      input_usd_per_million: 0.20
      output_usd_per_million: 1.20

# Embedding phải dùng model chuyên dụng, không dùng model chat ở trên.
# Index ghi lại model thực tế trong manifest để retriever dùng đúng vector space.
embedding_policy:
  primary:
    provider: gemini
    model: gemini-embedding-001
  fallback:
    provider: openai
    model: text-embedding-3-small

# Hiệu chỉnh bằng 10 câu truy vấn thật của HOA-06 trên gemini-embedding-001.
# Điểm in-scope thấp nhất: 0.7267; điểm out-of-scope cao nhất: 0.5861.
retrieval_policy:
  min_score: 0.65
  relative_score_margin: 0.05
